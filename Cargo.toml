[workspace]
members = ["crates/digiflazz", "crates/digiflazz-service"]
resolver = "2"

[workspace.package]
version = "0.1.12"
edition = "2021"
rust-version = "1.70"
license = "MIT"
authors = ["Karyana Yandi <halo@yandi.me>"]
repository = "https://github.com/karyanayandi/digiflazz-sdk"
homepage = "https://github.com/karyanayandi/digiflazz-sdk"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
hex = "0.4"
http-body-util = "0.1"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
