[package]
name = "digiflazz"
version = "0.1.12"
edition = "2021"
rust-version = "1.70"
authors = ["Karyana Yandi <halo@yandi.me>"]
description = "Unofficial async Rust client for the Digiflazz API"
homepage = "https://github.com/karyanayandi/digiflazz-sdk"
repository = "https://github.com/karyanayandi/digiflazz-sdk"
license = "MIT"
readme = "README.md"
keywords = ["digiflazz", "pulsa", "topup", "api-client"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
hex = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "digiflazz"
path = "src/main.rs"

[dev-dependencies]
wiremock = "0.6"
