# nginx site for digiflazz-service on dfsdk.ttmi.my.id
#
# This file is HTTP-only ON PURPOSE. `certbot --nginx` must be able to run
# `nginx -t` successfully before it can issue a certificate, so a 443 block
# referencing a not-yet-existing certificate makes the whole flow fail.
# certbot adds the TLS server block itself after the certificate exists.
#
# Install (needs sudo):
#   sudo cp deploy/nginx/dfsdk.ttmi.my.id.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/dfsdk.ttmi.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dfsdk.ttmi.my.id

server {
    listen 80;
    listen [::]:80;
    server_name dfsdk.ttmi.my.id;

    # Required for the HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Until certbot rewrites this file, carry the API over plain HTTP so the
    # proxy works during the certificate step. certbot replaces this redirect
    # with the TLS server block.
    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Digiflazz calls can take a while; keep the same order of magnitude
        # as the upstream budget documented in INTEGRATION.md.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 1m;
    }
}
