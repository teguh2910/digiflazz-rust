# nginx site for digiflazz-service on dfsdk.ttmi.my.id
#
# Install (needs sudo):
#   sudo cp deploy/nginx/dfsdk.ttmi.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dfsdk.ttmi.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Obtain the certificate once the port 80 block is live (needs sudo):
#   sudo certbot --nginx -d dfsdk.ttmi.my.id
#
# certbot edits this file in place to add the ssl_certificate lines; the
# explicit paths below are what it will end up writing.

server {
    listen 80;
    listen [::]:80;
    server_name dfsdk.ttmi.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dfsdk.ttmi.my.id;

    ssl_certificate     /etc/letsencrypt/live/dfsdk.ttmi.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dfsdk.ttmi.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Request bodies here are tiny JSON documents.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Digiflazz calls can take a while; keep the same order of magnitude
        # as the upstream budget documented in INTEGRATION.md.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
